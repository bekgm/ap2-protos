name: Generate Go Protobuf Code

on:
  push:
    branches: [main]
    paths:
      - 'protos/**'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout protos repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.2
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.3.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Generate payment proto
        run: |
          mkdir -p gen/payment/v1
          protoc \
            --proto_path=protos \
            --go_out=gen --go_opt=paths=source_relative \
            --go-grpc_out=gen --go-grpc_opt=paths=source_relative \
            protos/payment/v1/payment.proto

      - name: Generate order proto
        run: |
          mkdir -p gen/order/v1
          protoc \
            --proto_path=protos \
            --go_out=gen --go_opt=paths=source_relative \
            --go-grpc_out=gen --go-grpc_opt=paths=source_relative \
            protos/order/v1/order.proto

      - name: Create go.mod and go.sum for generated module
        run: |
          cat > gen/go.mod << 'EOF'
          module github.com/bekgm/ap2-generated

          go 1.22

          require (
            google.golang.org/grpc v1.64.0
            google.golang.org/protobuf v1.34.2
          )
          EOF
          cd gen && go mod tidy

      - name: Checkout generated repo
        uses: actions/checkout@v4
        with:
          repository: bekgm/ap2-generated
          token: ${{ secrets.GEN_REPO_TOKEN }}
          path: ap2-generated

      - name: Copy generated files
        run: |
          cp -r gen/order ap2-generated/
          cp -r gen/payment ap2-generated/

      - name: Commit and push to generated repo
        working-directory: ap2-generated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "chore: regenerate from commit ${{ github.sha }}"
          git push

